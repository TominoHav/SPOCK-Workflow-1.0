# The regulatory areas: for each, the named regimes in it and which dossier holds the evidence behind it.
# Read by regmap.mjs, which writes specifications/REGMAP.md from it, and by derive.mjs, check.mjs, screening-inputs.mjs, content-register.mjs and facts.mjs.
# Edited by hand when an area or a regime is added, changed or withdrawn; then run `node .github/scripts/regmap.mjs --write`.
# Checked by C119, which fails when specifications/REGMAP.md is not what this file and the skills' bindings generate.

version: "0.1"
owner: ceska-sporitelna
written_by: igor.tadic
date: "2026-08-27"

# The mechanism — area-generic, read by every skill that reads an area.
mechanism:
  body: compliance/compliance-guidelines.md

# ── the four areas ───────────────────────────────────────────────────────────────────
#
# `source` says who supplied the card: `cs_card` means ČS supplied it, `authored_here` means it was written
# from public law because ČS has supplied none. The build reads it so a card ČS sends replaces ours; no output
# prints it.

areas:
  - id: A1
    name: Compliance, conduct and product regulation
    name_cs: Compliance, pravidla jednání a produktová regulace
    body: compliance/area-compliance.md
    dossier: specifications/regulatory-research/compliance.md
    source: cs_card
    source_status: unconfirmed          # the card self-verifies a date, which is why this is not `approved`
    supplied: "2026-08-26"
    transcript: specifications/regulatory-research/regulatory-map-compliance.md

  - id: A2
    name: GDPR and privacy
    name_cs: GDPR a ochrana osobních údajů
    body: compliance/area-gdpr.md
    dossier: specifications/regulatory-research/gdpr.md
    source: authored_here
    source_status: unreviewed
    supplied: "2026-08-27"
    note: "The regulatory concern producers raise most often, and the area with no ČS card. This is the one most worth ČS replacing."

  - id: A3
    name: Legal and contracts
    name_cs: Právo a smlouvy
    body: compliance/area-legal.md
    dossier: specifications/regulatory-research/legal.md
    source: authored_here
    source_status: unreviewed
    supplied: "2026-08-27"
    note: "Carries the one live gap in the four — an EU application date that has passed with the national implementation not confirmed as in force."

  - id: A4
    name: ICT and security
    name_cs: ICT a bezpečnost
    body: compliance/area-ict-security.md
    dossier: specifications/regulatory-research/ict-security.md
    source: authored_here
    source_status: unreviewed
    supplied: "2026-08-27"

# ── what is not covered, and which of the two kinds ──────────────────────────────────
#
# An area nobody chose to cover and an area we meant to cover and could not are different facts, and a
# reader acts differently on each. Both appear so that silence is never mistaken for clearance.

out_of_scope:
  - id: X1
    name: AI regulation
    disposition: routed
    reason: "Out as an area by decision, and routed rather than screened: an AI-driven recommendation, scoring or client decision is the Compliance card's escalation trigger C-E9. No card names the role a trigger routes to, and the compliance section derived for each solution raises only the triggers that fire on an unresolved sub-domain, which C-E9 does not, so no section raises it."
    primary: Regulation (EU) 2024/1689, as amended by Regulation (EU) 2026/1744

  - id: X2
    name: Outsourcing beyond ICT
    disposition: routed
    reason: "DORA's ICT third-party chapter is inside A4. Outsourcing that is not ICT is routed rather than screened, and the EBA outsourcing guidelines are named on the A3 card as a pointer."

  - id: X3
    name: Scheme rules and market infrastructure
    disposition: uncovered
    reason: "CERTIS, the EPC rulebook, ISO 20022 and card scheme agreements are not regulation and are in none of the four areas. They would have belonged to the `banking-constraints` body, which is retired and will not be written, so they are uncovered with no owner rather than pending one. A screen that returns clean has said nothing about any of them, and nothing now claims it will."

# ── the named regimes ────────────────────────────────────────────────────────────────
#
# Pointers with a status. `state` is the field a person scans: `in_force` is settled, `applies_from` has a
# fixed future date, `not_yet_law` has no fixed date, `moving` is under revision. Nothing here states what
# a regime requires — that is the area body's job and the dossier's evidence.

