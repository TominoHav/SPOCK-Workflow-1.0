- surface: .github/skills/prioritisation/SKILL.md
  text: "**Send the hand-off the workflow prints once the stage is accepted**: it names the agent that carries stage 3, read from the contract, never from what you remember."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/prioritisation/SKILL.md
  text: "**Do not restate the stage.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "Works on the cards, never the market; holds no tools."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**Output:** `{runs_root}/{run_id}/3-competitive-analysis/3-competitive-synthesis.md` — **run-scoped, never written to S1**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**Exclusions:** never researches · never reaches the market · **A7 is never written to the store** — it is run-scoped by contract, and this binding holds no capability to write it there · recommends no action"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "Never call it a gap in the market or say *the market has not*: **only a participant shown to have chosen not to do something is stated as a fact about that participant.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**8b — The verdict's opening weighs its parts by what the cards show, and never prices or picks one.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**Never say what a part would cost the bank, how hard it would be, what the bank can already do or where stage 4 should start, unless a card or the brief establishes it**: a card says what a competitor does and nothing about this bank's systems, so such a claim traces to nothing, and step 5 holds for it as for any element."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "The four verdict headings do not move — `C84` counts them — and this is the paragraph beneath the first."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**9 — Write A7 with the run identifier, and never to S1.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**Never drop a participant, never drop a facet, never truncate the evidence table.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**You do not run the quality gate, and it is the only control on this stage** — there is no human gate behind Q3 (§2.1)."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "Never report a gate result for your own output."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "A7 carries the run identifier and is never written to S1 — run-scoped by contract, enforced by the empty capability list"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "Do not start a line in the evidence table with a tier label, or that section becomes a facet and is held to the four-finding floor."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "`C24` covers the store, which you never write to."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "**That A7 never reaches S1 is a separate guarantee, and C24 is not its control** — A7 is governed output, not free-roam."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/synthesis/SKILL.md
  text: "Record it; do not overflow the category"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
