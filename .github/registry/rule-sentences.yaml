- surface: .github/skills/workflow-support/SKILL.md
  text: "**Exclusions:** writes nothing · fires nothing · **never reasons its way to a state edit** · reads no artifact's content, because the question is about the run's state and not about what a stage wrote"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**Read it off the record and never infer it from an exit code** — an exit code here means four different things and both a person and a producer have each misread one."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "Not a list of options, and never the operator override."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**Never end on a finding.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**So an agent that can edit one file can edit every file**, and *it will only touch the run, never the machinery* would be instruction rather than enforcement."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**You never become a writer.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "You can never be the first thing to fix a novel problem — only something already seen, understood and written down."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**Name the sign-off, never the agent.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "Use its `query` action and never `reindex`, which rebuilds the store and can sync it to the cloud."
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "**Never read, summarise or quote a session from another folder.**"
  sort: unseen
  by: ""
  seen: ""
  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "`RUN-STATE.md` and the task output say where the run stands, and a chat is evidence of what an agent said, never of the run's state."
  sort: unseen
