  ticket: ""
- surface: .github/skills/workflow-support/SKILL.md
  text: "The names every producing skill is held to are declared in §6 of the parent and generated into [`.github/artifact-fields.yaml`](../../artifact-fields.yaml); **you read them to say what a record owes and you never write one.**"
