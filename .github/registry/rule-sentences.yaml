  text: "**Q3** — `C8` every reused card shows `researched_at` · `C54` every participant is typed and carries an `identity_key` that resolves to S1 · `C55` every selection and non-selection carries a reason · `C24` no free-roam write to S1 · `C81` three trend classes, 3 to 5 each, and every regulatory trend naming its `instrument` and `effective` date · `C88` every non-substitute participant carries a `standing`, both kinds appear on the map, and every trend is either represented or recorded in `unrepresented_trends` · `C75` ten participants **carry a card**, and where a person supplied the market the aim is the list's own count, never above ten and never below three (from Standards v0.18); a count below the aim passes where the shortfall is stated, as `A6.unprofiled[]` for a participant selected and not profiled or `deep_dive: false` with its reason for one never selected, and three is the hard bottom no statement reaches; the aim and the bottom apply from Standards v0.6."
