# The current-process baseline: the two measures a run's outcome is compared with, each with its value, its source and when it was captured, or why it has none.
# Read by metrics.mjs and repo-check.mjs.
# Edited by hand when a measure is supplied, with the source of its value.
# Checked by C64: the record is well formed, its state agrees with its own values, and §1.3 of the business logic states the same state.

version: "0.1"
owner: igor.tadic
state: absent                  # absent | approximate | measured
captured_at: null
method: null
expires_on: >
  The first time a team runs discovery through the pilot instead of through their current process.
  After that the baseline is unrecoverable, and S4 and S5 are permanently unevaluable rather than
  temporarily unmeasured.

# `approximate` is the recommended landing state, not a lesser one. Whatever Jira, the tickets or the
# team's own recollection can supply, recorded as approximate and labelled as such, beats the precise
# measurement that never gets scheduled. What is refused is a number with no source and no date, because
# that is indistinguishable afterwards from a guess.
measures:
  - id: cycle_time
    criterion: S4
    question: >
      Calendar days from the moment an initiative brief is first written to the moment a delivery-ready
      initiative document is agreed, on the current process, without the pilot.
    value: unknown
    reason: not supplied — the measurement has never been scheduled and no source has been named
    source: null
    captured_at: null

  - id: rework_rate
    criterion: S5
    question: >
      How often an initiative that reached delivery-ready had to be reopened and materially changed,
      as a proportion of initiatives, on the current process.
    value: unknown
    reason: not supplied — the measurement has never been scheduled and no source has been named
    source: null
    captured_at: null

# What the pilot does in the absence of this record. Stated here so the degradation travels with the
# thing that causes it rather than living only in an open-questions list.
without_it: >
  S4 and S5 are declared unevaluable rather than measured, and the pilot stands on four criteria instead
  of six. S1, S2 and S3 are observable inside the pilot and S6 is collected from the people who ran it,
  so nothing here blocks a run — what it blocks is the two claims a buyer is most likely to ask for.
