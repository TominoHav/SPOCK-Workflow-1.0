  - id: ideation
    name: Solution Ideation
    path: .github/skills/ideation/SKILL.md
    agent: product-manager
    stage: "4.1"
    pattern: single-shot
    owner: igor.tadic
    reusable: true
    requires: [A1, A4, A3b, A7]
    produces: [A8]
    know_how:
      - .github/know-how/product/stage-4-shapes.md  # bound: 2026-09-06 — the shape a refused artifact should have taken, keyed on the gate message
      - .github/know-how/product/strategy-basis.md  # bound: 2026-09-07 — §7 of every idea names a pillar this body declares, work `idea-scoring` used to carry
      - .github/know-how/method/discovery-craft.md  # bound: 2026-09-07 — what a producer knows before it starts, as distinct from what it is told to write
      - .github/know-how/method/method-canon.md  # bound: 2026-09-02 — the method for this stage; the Coach owns no stage and a run completes without calling it
      - .github/know-how/compliance/compliance-guidelines.md
      - .github/know-how/compliance/area-compliance.md
      - .github/know-how/compliance/area-gdpr.md
      - .github/know-how/compliance/area-legal.md
      - .github/know-how/compliance/area-ict-security.md
      - .github/know-how/compliance/screening-inputs.md   # bound: 2026-09-01 — resolves a `cannot determine` to a declared input id
      - .github/know-how/writing/agent-interaction.md  # bound: 2026-09-02 — F1, the interaction rules every skill is held to
      - .github/know-how/writing/output-voice.md
      - .github/know-how/writing/documentation-standards.md
    triggers: [generate ideas, stage 4, ideation, idea set, what could we build, screen the solutions, per-solution compliance]
    bounds:
      ideas: "3..10"
      areas_examined: 4
      sub_domains_blank: 0
    guardrails: [no_score_or_rank, every_idea_binds_problem_and_element, primary_problems_covered,
                 no_compliance_judgement, three_states_only, unfilled_area_returns_no_map, no_value_and_no_score]
    version: "0.1"
    execution:                                     # governed: family (R5.3-2) + pin (AB-53)
      family: anthropic-claude
      model: claude-sonnet-5
    status: built
    on_unclassifiable_input: stop_and_escalate    # §6.6 / AB-40 — CF-19
    record:                                        # AB-2 record part — CF-10
      type: idea-set
      links: [derives_from]
      requires: [run_id, revisions]
    reductions:                                    # R5-9 — see .github/scripts/reductions.mjs
      - id: compliance-shaping
        marker: "compliance touchpoints marked indicative, or naming the body as absent"
        lifts_when: know_how_present
        body: .github/know-how/compliance/compliance-guidelines.md
        state: lifted
        lifted_on: "2026-08-27"
    quality:                                       # AB-2 quality part — CF-10
      rules:
        - 3..10 solutions, each a distinct combination of opportunities, never a rephrasing
        - every solution binds at least one opportunity and one synthesis element, or is invalid
        - no solution carries a score, rank, ordering or recommendation
        - every sub-domain in a filled area carries one of three states, and the phrase "not applicable" appears nowhere
        - every cannot-determine names the input that would settle it, and never becomes a not-triggered
        - every area is reported, including one that fired nothing (C126)
        - every solution carries its own escalation flag, and a solution may fire a trigger no other one did
        - every trigger a section fires puts in play the sub-domains its own area body says it does
        - no complexity value and no score is written in a compliance section
        - each solution is screened against itself, and identical sections across the set are reported rather than differentiated
      evaluation: .github/skills/ideation/evals/
      evaluator: "mechanical 7 · judged 3"

