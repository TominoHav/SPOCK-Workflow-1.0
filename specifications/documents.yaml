# The design documents — the one register for what no other registry owns.
#
# **Why this exists.** Every other surface in this build has a register behind it: the agents, the skills,
# the artifacts, the checks, the know-how bodies, the regulatory areas, the scoring model. Without one here, a
# design document could drift from the build with nothing noticing.
#
# **What it does not do.** It does not restate what another registry already holds. A know-how body is
# governed by `skills.yaml` and `area.md`, and a regulatory dossier by
# `regmap.yaml`. Those folders are listed under `governed:` with the registry and the checks that own
# them, and their files are not entered here. **Copying their paths into a second file is the
# duplication this register exists to refuse.**
#
# **Three dispositions and no fourth.** A markdown file under `specifications/` is entered here, or it sits in a
# folder another registry governs, or it sits in a folder this file exempts with a reason. `C135` fails the
# build on anything else, which is what stops the tidy from silently coming undone.

version: "0.1"
owner: igor.tadic
date: "2026-08-27"

# ── folders another registry owns ────────────────────────────────────────────────────
#
# The registry named is the authority on what belongs there; the checks named are what enforce it. A file
# in one of these is accounted for by that machinery and is not entered below.

governed:
  - path: specifications/definitions/know-how/
    by: .github/registry/skills.yaml, specifications/definitions/area.md
    checks: [C41, C68, C90, C94]
    note: "The source of record for the generated tree at .github/know-how/. C41 compares the two in both directions."

  - path: specifications/regulatory-research/
    by: .github/registry/regmap.yaml
    checks: [C119]
    note: "One dossier per regulatory area, holding the statutory reading behind that area's card, plus the ČS transcript behind the one area card the bank supplied. C119 fails when a dossier or a transcript the registry names has moved. **The transcript sits with the dossiers**, beside every other piece of regulatory evidence."

# ── folders deliberately outside the register ────────────────────────────────────────
#
# **A reason, not a silence.** An exemption with no reason is indistinguishable from a folder nobody got
# round to registering.

exempt:

  - path: specifications/evidence/
    reason: "**Measured evidence kept beside the build.** It holds the variance proof `assurance.yaml` names and the first free-roam dispatch, because a registry pointing outside the repository is a claim a reader cannot check. It is exempt rather than registered because evidence is dated by nature and its purpose ends when the measurement is retaken."
    decided_by: igor.tadic
    decided_on: "2026-08-28"

# ── every generated surface, and what guards it ──────────────────────────────────────
#
# **A generated file that nothing regenerates and nothing guards is the worst of both**: it reads as
# derived and is maintained by hand.
#
# `C135` requires each entry to name a generator that exists and a guard that is a registered check. **The
# list is here because no other registry owns it** — that is this file's whole remit.

generated_surfaces:
  - path: .github/know-how/
    generator: .github/scripts/know-how.mjs
    guard: C41
    from: specifications/definitions/know-how/

  - path: .github/artifact-fields.yaml
    generator: .github/scripts/artifact-fields.mjs
    guard: C73
    from: "§6 of specifications/PILOT-BUSINESS-LOGIC.md"

  - path: .github/could-not-verify.yaml
    generator: .github/scripts/unverified.mjs
    guard: C72
    from: the gate model in .github/scripts/gates.mjs

  - path: .github/composed-behaviours.yaml
    generator: .github/scripts/floor.mjs
    guard: C45
    from: COMPOSED_FLOOR in .github/scripts/gates.mjs

  - path: .github/COVERAGE-CHECKS.md
    generator: .github/scripts/register.mjs
    guard: C44
    from: "the cards in checks.yaml, §7.4, gates.mjs, check.mjs and shapes.yaml"

  - path: specifications/REGMAP.md
    generator: .github/scripts/regmap.mjs
    guard: C119
    from: .github/registry/regmap.yaml plus the skill bindings

  - path: specifications/CONTENT-REGISTER.md
    generator: .github/scripts/content-register.mjs
    guard: C135
    from: every registry, plus this file

  - path: ".github/store/S1-competitors.md"
    generator: .github/scripts/store.mjs
    guard: C74
    # **`corpus`, because the store is derived from committed runs and never from the configured runs
    # root.** `store.mjs` writes `.github/store/S1-competitors.md` from the committed example runs and the
    # runs a person keeps (none has been kept yet), whose competitor records are copied into the committed
    # `.github/store/corpus` first; a live run nobody keeps never enters a file that ships. The path carries no
    # `{runs_root}`, so the root changes nothing about where `C135` looks for the file.
    root: corpus
    from: the competitor cards of the committed example runs and of the runs a person keeps
    note: "**No entry here names `fixtures/`.** The runs root is a setting, so the store is written under `.github/store/`, which is committed and is not a run, and a skill can name it without naming a root."

  - path: .github/OPERATING-A-RUN.md
    generator: .github/scripts/operator.mjs
    guard: C144
    from: the workflow contracts, the gate model, the scripts register and the run tree

  # ── r1.9 · H3 §5.8 ── **`in_release_only`, because this surface exists in a release copy and nowhere else.** The
  # release tool writes it after the competitor store is rebuilt, so it lists exactly what ships; a list in the product
  # repository would describe a tree no tester holds. `C135` does not ask for it on disk here, and `C189` reads it in a
  # tester's copy, where a copy with none says it was not made by a release.
  - path: .github/release-files.json
    generator: .github/scripts/release-files.mjs
    guard: C189
    from: every file under .github/ and .vscode/ in the release copy, and the release in .github/build
    in_release_only: true

  - path: "{runs_root}/{run_id}/README.md"
    generator: .github/scripts/run-readme.mjs
    guard: C79
    from: the run's own record
    per_run: true

  - path: "{runs_root}/{run_id}/read/7-initiative/initiative.md"
    generator: .github/scripts/reading-copy.mjs
    guard: C96
    from: A14, with its machine record stripped
    per_run: true

# ── the documents this register owns ─────────────────────────────────────────────────
#
# `generated: true` requires a generator and the check that guards it, because a generated file that
# nothing regenerates and nothing guards is the worst of both: it reads as derived and is maintained by
# hand.

# `release` is the build a hand-written document was last read against. Move it when you have read the document
# against a new build, whether you changed it or not, and quote it, so 1.10 is not read as 1.1. Where the document
# carries its own `**Release:**` line, the two are the same value. `C135` refuses a hand-written document with no stamp,
# a stamp that is not a release or is past the release `.github/build` is being prepared for, and a text line that
# disagrees with its stamp. The release tool lists every document stamped behind the build it ships, and refuses the
# release for them once that refusal is switched on. A generated document takes no stamp: its generator and its guard
# keep it current. The pinned governing documents take none either, since `C174` holds each to its stated version.
documents:
